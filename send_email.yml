---
- name: Send Professional Patch Report
  hosts: localhost
  gather_facts: yes
  vars:
    # 1. ข้อมูลการเชื่อมต่อ (ดึงจากตัวแปรที่คุณส่งมา)
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_username: "{{ email_username }}"
    smtp_password: "{{ email_password }}"
    email_from: "{{ smtp_username }}"
    email_to: "{{ recipient_email }}"
    email_subject: "🚀 {{ email_subject | default('Patching Report') }}"
    # 2. เก็บโครงสร้าง HTML ไว้ที่นี่ (จะไม่โดนทับ)
    # เราจะเอา {{ email_body }} ที่คุณส่งมา ไปใส่ไว้ในช่อง Task Description
    html_template: |
      <html>
        <body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; background-color: #f4f7f9; padding: 20px;">
          <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #0056b3;">
            <div style="background-color: #0056b3; padding: 20px; text-align: center;">
              <h1 style="color: #ffffff; margin: 0; font-size: 22px;">System Maintenance Report</h1>
            </div>
            <div style="padding: 30px;">
              <p>เรียน ผู้ดูแลระบบ,</p>
              <p>ดำเนินการติดตั้ง Patch เสร็จสิ้นแล้ว โดยมีรายละเอียดดังนี้:</p>
              <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <tr>
                  <td style="padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; font-weight: bold;">Task Description</td>
                  <td style="padding: 10px; border: 1px solid #dee2e6;">{{ email_body }}</td>
                </tr>
                <tr>
                  <td style="padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; font-weight: bold;">Target Server</td>
                  <td style="padding: 10px; border: 1px solid #dee2e6; color: #0056b3; font-weight: bold;">{{ vm_names | default('N/A') }}</td>
                </tr>
                <tr>
                  <td style="padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; font-weight: bold;">WSUS Server</td>
                  <td style="padding: 10px; border: 1px solid #dee2e6;">{{ wsus_server | default('Default') }}</td>
                </tr>
                <tr>
                  <td style="padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; font-weight: bold;">Backup Path</td>
                  <td style="padding: 10px; border: 1px solid #dee2e6;">{{ backup_path | default('N/A') }}</td>
                </tr>
              </table>
              <p style="margin-top: 20px; font-size: 12px; color: #777;">รายงานฉบับนี้สร้างขึ้นโดยอัตโนมัติเมื่อวันที่ {{ ansible_date_time.date }}</p>
            </div>
          </div>
        </body>
      </html>
  tasks:
    - name: Send Professional HTML Email
      ansible.builtin.shell: |
        python3 << 'EOF'
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart

        # ดึงค่าจากตัวแปร Ansible
        smtp_host = "{{ smtp_host }}"
        smtp_port = {{ smtp_port }}
        username = "{{ smtp_username }}"
        password = "{{ smtp_password }}"
        from_addr = "{{ email_from }}"
        to_addr = "{{ email_to }}"
        subject = "{{ email_subject }}"

        # ใช้ html_template ที่เราเตรียมไว้
        html_content = """{{ html_template }}"""

        msg = MIMEMultipart('alternative')
        msg['From'] = from_addr
        msg['To'] = to_addr
        msg['Subject'] = subject

        # ส่งเป็น HTML
        msg.attach(MIMEText(html_content, 'html'))

        try:
            server = smtplib.SMTP(smtp_host, smtp_port)
            server.starttls()
            server.login(username, password)
            server.sendmail(from_addr, [to_addr], msg.as_string())
            server.quit()
            print("Successfully sent report")
        except Exception as e:
            print(f"Error: {e}")
            exit(1)
        EOF
      register: email_status

    - name: Debug Status
      debug:
        msg: "{{ email_status.stdout }}"
