---
- name: Patch Windows (Supports MSU and WSUS methods)
  hosts: all
  gather_facts: false
  vars:
    #target_kb_id: "KB5074975"
    #target_msu_path: "C:\\PatchTemp\\KB5074975.msu"
    #patch_method: 'msu' 

  tasks:
    # ==========================================
    # Patch Method 1: MSU File (Default)
    # File is placed at C:\PatchTemp\KB5074975.msu
    # ==========================================
    - name: Executing Patch via stand-alone MSU file
      when: patch_method == 'msu'
      block:
        - name: Verify patch before installation (Pre-Install Check)
          ansible.windows.win_shell: |
            Try {
                $hotfix = Get-HotFix -Id {{ target_kb_id }} -ErrorAction Stop
                Write-Output "Installed"
            } Catch {
                Write-Output "Not Installed"
            }
          register: pre_install_check
          changed_when: false

        - name: Display Pre-Install Check Result
          ansible.builtin.debug:
            msg: "{{ target_kb_id }} status before patching: {{ pre_install_check.stdout | trim }}"

        # Only proceed if the patch is not installed
        - name: Apply Patch MSU
          when: "'Not Installed' in pre_install_check.stdout"
          block:
            # 1. Stop Service Apache and MySQL
            - name: Stop Service Apache and MySQL before patching
              ansible.windows.win_service:
                name: "{{ item }}"
                state: stopped
              loop:
                - "Apache2.4"
                - "MySQL80"
              ignore_errors: true

            # 2. Apply patch using win_hotfix
            - name: Apply patch using win_hotfix
              ansible.windows.win_hotfix:
                source: "{{ target_msu_path }}"
                state: present
              register: hotfix_result

            # 3. Restart Server
            - name: Reboot Windows System if required by the patch
              ansible.windows.win_reboot:
                reboot_timeout: 18000
              when: hotfix_result.reboot_required | default(false)

        # Post-Installation Check for MSU
        - name: Verify patch after installation (Post-Install Check)
          ansible.windows.win_shell: |
            Try {
                $hotfix = Get-HotFix -Id {{ target_kb_id }} -ErrorAction Stop
                Write-Output "Installed"
            } Catch {
                Write-Output "Not Installed"
                exit 1
            }
          register: post_install_check
          changed_when: false
          failed_when: "'Not Installed' in post_install_check.stdout"

        - name: Display Post-Install Check Result
          ansible.builtin.debug:
            msg: "{{ target_kb_id }} status after patching: {{ post_install_check.stdout | trim }}"


    # ==========================================
    # Patch Method 2: WSUS (Install specific ID or select first ID)
    # ==========================================
    - name: Executing Patch via WSUS
      when: patch_method == 'wsus'
      block:
        - name: Search for available updates from WSUS
          ansible.windows.win_updates:
            state: searched
          register: wsus_search

        - name: Set target update list fact
          ansible.builtin.set_fact:
            # รองรับการส่งค่าหลายตัวผ่าน comma เช่น KB5074975,KB5074976 โดยดึงจาก target_kb_id หรือ target_wsus_id
            updates_to_install: >-
              {%- if target_kb_id | default('', true) != '' -%}
              {{ target_kb_id.split(',') | map('trim') | list }}
              {%- elif target_wsus_id | default('', true) != '' -%}
              {{ target_wsus_id.split(',') | map('trim') | list }}
              {%- elif wsus_search.updates is defined and wsus_search.updates | length > 0 -%}
              [ "{{ wsus_search.updates[0].id }}" ]
              {%- else -%}
              []
              {%- endif -%}

        # Only proceed to stop services and install if an update ID is determined
        - name: Install WSUS Update
          when: updates_to_install | length > 0
          block:
            # 1. Stop Service Apache and MySQL
            - name: Stop Service Apache and MySQL before patching
              ansible.windows.win_service:
                name: "{{ item }}"
                state: stopped
              loop:
                - "Apache2.4"
                - "MySQL80"
              ignore_errors: true
              
            # 2. Install the update
            - name: Install the specified updates from WSUS
              ansible.windows.win_updates:
                state: installed
                accept_list: "{{ updates_to_install }}"
              register: wsus_install

            # 3. Restart Server
            - name: Reboot Windows System if required by WSUS update
              ansible.windows.win_reboot:
                reboot_timeout: 18000
              when: wsus_install.reboot_required | default(false)

        - name: Display WSUS Install Status
          ansible.builtin.debug:
            msg: "WSUS updates {{ 'installed: ' + (updates_to_install | join(', ')) if updates_to_install | length > 0 else 'not found. No updates required.' }}"

    # ==========================================
    # Shared Post Tasks (Starts services and validations)
    # ==========================================
    - name: Shared Post Tasks Implementation
      block:
        # 4. Start Service Apache ,MySQL
        - name: Start Service Apache and MySQL
          ansible.windows.win_service:
            name: "{{ item }}"
            state: started
          loop:
            - "Apache2.4"
            - "MySQL80"
          ignore_errors: true

        # 5. Check Service Apache ,Mysql
        - name: Check Service Apache and MySQL status
          ansible.windows.win_service:
            name: "{{ item }}"
          loop:
            - "Apache2.4"
            - "MySQL80"
          register: service_status

        - name: Display Service Status
          ansible.builtin.debug:
            msg: "Service {{ item.item }} is currently {{ item.state }}"
          loop: "{{ service_status.results }}"

        # 6. test Open web https://iam-uat.exim.go.th/
        - name: Test Open Web iam-uat.exim.go.th
          ansible.windows.win_uri:
            url: https://iam-uat.exim.go.th/
            method: GET
            validate_certs: no
            return_content: yes
          register: web_test
          ignore_errors: true

        - name: Display Web Test Status
          ansible.builtin.debug:
            msg: "Web Access {{ 'SUCCEEDED' if web_test.status_code == 200 else 'FAILED' }} (Status Code: {{ web_test.status_code | default('N/A') }})"

        # 7. Run .bat Start Service D:\PJ_iAM\Code_iAM\iAM.bat
        - name: Run iAM.bat to Start Service
          ansible.windows.win_command: D:\PJ_iAM\Code_iAM\iAM.bat
          register: iambat_result
          ignore_errors: true

        - name: Display iAM.bat Execution Status
          ansible.builtin.debug:
            msg: "iAM.bat execution finished with return code {{ iambat_result.rc | default('N/A') }}"
