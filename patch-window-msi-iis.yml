---
- name: Patch Windows with stand-alone MSU file
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify patch before installation (Pre-Install Check)
      ansible.windows.win_shell: |
        Try {
            $hotfix = Get-HotFix -Id KB5074975 -ErrorAction Stop
            Write-Output "Installed"
        } Catch {
            Write-Output "Not Installed"
        }
      register: pre_install_check
      changed_when: false

    - name: Display Pre-Install Check Result
      ansible.builtin.debug:
        msg: "KB5074975 status before patching: {{ pre_install_check.stdout | trim }}"

    # 1. Stop Service IIS
    - name: Stop Service IIS before patching
      ansible.windows.win_service:
        name: "W3SVC" # W3SVC คือ World Wide Web Publishing Service ของ IIS
        state: stopped
      when: "'Not Installed' in pre_install_check.stdout"
      ignore_errors: true

    - name: Download and Install Patch if not installed
      when: "'Not Installed' in pre_install_check.stdout"
      block:
        - name: Ensure temp directory exists for patch download
          ansible.windows.win_file:
            path: C:\PatchTemp
            state: directory

        # 2. Apply patch MSI
        - name: Apply patch silently using DISM (Alternative to win_hotfix)
          ansible.windows.win_command: dism.exe /Online /Add-Package /PackagePath:"C:\PatchTemp\KB5074975.msu" /Quiet /NoRestart
          register: dism_result
          failed_when: dism_result.rc not in [0, 3010]
          changed_when: dism_result.rc in [0, 3010]
          async: 3600
          poll: 30

        # 3. Restart Server
        - name: Reboot Windows System if required by the patch
          ansible.windows.win_reboot:
            reboot_timeout: 18000
          when: dism_result.rc == 3010

        - name: Clean up downloaded MSU file
          ansible.windows.win_file:
            path: C:\PatchTemp\KB5074975.msu
            state: absent

    - name: Verify patch after installation (Post-Install Check)
      ansible.windows.win_shell: |
        Try {
            $hotfix = Get-HotFix -Id KB5074975 -ErrorAction Stop
            Write-Output "Installed"
        } Catch {
            Write-Output "Not Installed"
            exit 1
        }
      register: post_install_check
      changed_when: false
      failed_when: "'Not Installed' in post_install_check.stdout"

    - name: Display Post-Install Check Result
      ansible.builtin.debug:
        msg: "KB5074975 status after patching: {{ post_install_check.stdout | trim }}"

    # 4. Check Service IIS is running
    - name: Check Service IIS status
      ansible.windows.win_service:
        name: "W3SVC"
      register: iis_service_status

    - name: Display IIS Service Status
      ansible.builtin.debug:
        msg: "Service W3SVC (IIS) is currently {{ iis_service_status.state }}"
