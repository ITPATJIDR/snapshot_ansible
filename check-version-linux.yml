---
- name: Check Nginx Version on Linux Hosts
  hosts: all
  gather_facts: yes
  tags:
    - check-version

  tasks:
    - name: Check if nginx is installed
      command: which nginx
      register: nginx_path
      ignore_errors: yes
      changed_when: false

    - name: Fail if nginx is not installed
      fail:
        msg: "Nginx is not installed on this host"
      when: nginx_path.rc != 0

    - name: Get nginx version
      shell: |
        NGINX_BIN=$(rpm -ql nginx 2>/dev/null | grep -E '/(s)?bin/nginx$' | head -1)
        NGINX_BIN=${NGINX_BIN:-$(command -v nginx || echo "/usr/sbin/nginx")}
        if [ -x "$NGINX_BIN" ]; then
            "$NGINX_BIN" -v 2>&1
        else
            echo "Unknown"
        fi
      register: nginx_version
      changed_when: false
      failed_when: false

    - name: Display nginx version
      debug:
        msg: "{{ nginx_version.stdout | default('Unknown', true) }}"
    
    - name: Pass Nginx version after to next job in AWX workflow
      set_stats:
        data:
          nginx_version_after: "{{ nginx_version.stdout | default('Unknown', true) }}"
