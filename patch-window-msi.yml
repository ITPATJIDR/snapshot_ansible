---
- name: Patch Windows with stand-alone MSU file
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify patch before installation (Pre-Install Check)
      ansible.windows.win_shell: |
        Try {
            $hotfix = Get-HotFix -Id KB5074975 -ErrorAction Stop
            Write-Output "Installed"
        } Catch {
            Write-Output "Not Installed"
        }
      register: pre_install_check
      changed_when: false

    - name: Display Pre-Install Check Result
      ansible.builtin.debug:
        msg: "KB5074975 status before patching: {{ pre_install_check.stdout | trim }}"

    # 1. Stop Service Apache
    - name: Stop Service Apache before patching
      ansible.windows.win_service:
        name: "Apache2.4" # กรุณาตรวจสอบชื่อ Service อีกครั้ง (อาจเป็น Apache, Apache2.4 ฯลฯ)
        state: stopped
      when: "'Not Installed' in pre_install_check.stdout"
      ignore_errors: true

    - name: Download and Install Patch if not installed
      when: "'Not Installed' in pre_install_check.stdout"
      block:
        - name: Ensure temp directory exists for patch download
          ansible.windows.win_file:
            path: C:\PatchTemp
            state: directory

        # 2. Apply patch MSI
        - name: Apply patch silently using DISM (Alternative to win_hotfix)
          ansible.windows.win_command: dism.exe /Online /Add-Package /PackagePath:"C:\PatchTemp\KB5074975.msu" /Quiet /NoRestart
          register: dism_result
          failed_when: dism_result.rc not in [0, 3010]
          changed_when: dism_result.rc in [0, 3010]
          async: 3600
          poll: 30

        # 3. Restart Server
        - name: Reboot Windows System if required by the patch
          ansible.windows.win_reboot:
            reboot_timeout: 18000
          when: dism_result.rc == 3010

        - name: Clean up downloaded MSU file
          ansible.windows.win_file:
            path: C:\PatchTemp\KB5074975.msu
            state: absent

    - name: Verify patch after installation (Post-Install Check)
      ansible.windows.win_shell: |
        Try {
            $hotfix = Get-HotFix -Id KB5074975 -ErrorAction Stop
            Write-Output "Installed"
        } Catch {
            Write-Output "Not Installed"
            exit 1
        }
      register: post_install_check
      changed_when: false
      failed_when: "'Not Installed' in post_install_check.stdout"

    - name: Display Post-Install Check Result
      ansible.builtin.debug:
        msg: "KB5074975 status after patching: {{ post_install_check.stdout | trim }}"

    # 4. Start Service Apache ,MySQL
    - name: Start Service Apache and MySQL
      ansible.windows.win_service:
        name: "{{ item }}"
        state: started
      loop:
        - "Apache2.4" # กรุณาตรวจสอบชื่อ Service อีกครั้ง
        - "MySQL80"     # กรุณาตรวจสอบชื่อ Service อีกครั้ง
      ignore_errors: true

    # 5. Check Service Apache ,Mysql
    - name: Check Service Apache and MySQL status
      ansible.windows.win_service:
        name: "{{ item }}"
      loop:
        - "Apache2.4"
        - "MySQL"
      register: service_status

    - name: Display Service Status
      ansible.builtin.debug:
        msg: "Service {{ item.item }} is currently {{ item.state }}"
      loop: "{{ service_status.results }}"

    # 6. test Open web https://iam-uat.exim.go.th/
    - name: Test Open Web iam-uat.exim.go.th
      ansible.windows.win_uri:
        url: https://iam-uat.exim.go.th/
        method: GET
        validate_certs: no
        return_content: yes
      register: web_test
      ignore_errors: true

    - name: Display Web Test Status
      ansible.builtin.debug:
        msg: "Web Access {{ 'SUCCEEDED' if web_test.status_code == 200 else 'FAILED' }} (Status Code: {{ web_test.status_code | default('N/A') }})"

    # 7. Run .bat Start Service D:\PJ_iAM\Code_iAM\iAM.bat
    - name: Run iAM.bat to Start Service
      ansible.windows.win_command: D:\PJ_iAM\Code_iAM\iAM.bat
      register: iambat_result
      ignore_errors: true

    - name: Display iAM.bat Execution Status
      ansible.builtin.debug:
        msg: "iAM.bat execution finished with return code {{ iambat_result.rc | default('N/A') }}"
